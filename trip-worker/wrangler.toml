name = "nature-trip-uploader"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Bind your existing R2 bucket (change name if different)
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "trips"

# Resize originals at request time. Uploads stay untouched.
[images]
binding = "IMAGES"

[[d1_databases]]
binding = "DB"
database_name = "nature-trips"
database_id = "50d056d3-7d4d-47da-bfd3-a2e2e2c3aafd"
migrations_dir = "migrations"

[[routes]]
pattern = "photos.rongwuxu.com"
custom_domain = true

# After first deploy, set:
#   wrangler secret put ADMIN_PASSWORD
# Optional override for public photo URL base:
#   wrangler secret put PUBLIC_BASE_URL
# Default used in code if unset:
#   https://pub-ef165a3e20f24d10a0bafbb1aa236e40.r2.dev
